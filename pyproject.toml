[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-compras"
version = "2.0.0"
description = "API REST multi-almacén para comparación de compras"
requires-python = ">=3.10"
dependencies = [
  "pymongo>=4.6,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.16,<3",
]

[tool.setuptools]
packages = ["controllers", "models", "views", "views.api"]
