components:
  schemas:
    AlmacenRespuesta:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        products:
          type: integer
          title: Products
      type: object
      required:
      - id
      - name
      - products
      title: AlmacenRespuesta
    BusquedaRespuesta:
      properties:
        modo:
          type: string
          title: Modo
        resultados:
          items:
            $ref: '#/components/schemas/ResultadoBusquedaItem'
          type: array
          title: Resultados
      type: object
      required:
      - modo
      - resultados
      title: BusquedaRespuesta
    BusquedaSolicitud:
      properties:
        modo:
          type: string
          enum:
          - mejor_precio
          - catalogo
          - global
          title: Modo
          default: mejor_precio
        limit:
          type: integer
          maximum: 500.0
          minimum: 1.0
          title: Limit
          default: 100
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          default: 0
      type: object
      title: BusquedaSolicitud
    CarritoProductoSolicitud:
      properties:
        almacen_id:
          type: integer
          minimum: 1.0
          title: Almacen Id
        producto_id:
          type: string
          minLength: 1
          title: Producto Id
      type: object
      required:
      - almacen_id
      - producto_id
      title: CarritoProductoSolicitud
    CatalogoRolesRespuesta:
      properties:
        roles:
          items:
            $ref: '#/components/schemas/RolRespuesta'
          type: array
          title: Roles
        permisos:
          items:
            $ref: '#/components/schemas/PermisoRespuesta'
          type: array
          title: Permisos
      type: object
      required:
      - roles
      - permisos
      title: CatalogoRolesRespuesta
    ClaveAdministrador:
      properties:
        clave:
          type: string
          minLength: 1
          title: Clave
      type: object
      required:
      - clave
      title: ClaveAdministrador
    ComparadorEstadoRespuesta:
      properties:
        estado:
          type: string
          title: Estado
        documentos:
          type: integer
          title: Documentos
          default: 0
        ultima_sincronizacion:
          anyOf:
          - type: string
          - type: 'null'
          title: Ultima Sincronizacion
        ultimo_evento:
          anyOf:
          - type: string
          - type: 'null'
          title: Ultimo Evento
        tiene_resume_token:
          type: boolean
          title: Tiene Resume Token
          default: false
      type: object
      required:
      - estado
      title: ComparadorEstadoRespuesta
    CsvSolicitud:
      properties:
        contenido:
          type: string
          minLength: 1
          title: Contenido
      type: object
      required:
      - contenido
      title: CsvSolicitud
    DescuentoSolicitud:
      properties:
        tipo:
          type: string
          enum:
          - sin
          - porcentaje
          - fijo
          title: Tipo
        valor:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Valor
      type: object
      required:
      - tipo
      title: DescuentoSolicitud
    EstadoSesion:
      properties:
        usuario:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario
        rol:
          type: string
          title: Rol
        descripcion_rol:
          type: string
          title: Descripcion Rol
          default: ''
        permisos:
          items:
            type: string
          type: array
          title: Permisos
        almacen_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Almacen Id
        usuario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Id
        lista:
          items:
            type: string
          type: array
          title: Lista
        carrito:
          $ref: '#/components/schemas/ResumenCarrito'
      type: object
      required:
      - usuario
      - rol
      - lista
      - carrito
      title: EstadoSesion
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthRespuesta:
      properties:
        status:
          type: string
          title: Status
        database:
          anyOf:
          - type: string
          - type: 'null'
          title: Database
      type: object
      required:
      - status
      title: HealthRespuesta
    ImportacionCsvRespuesta:
      properties:
        importados:
          type: integer
          title: Importados
        rechazados:
          type: integer
          title: Rechazados
        errores:
          items:
            type: string
          type: array
          title: Errores
      type: object
      required:
      - importados
      - rechazados
      - errores
      title: ImportacionCsvRespuesta
    ListaProductoSolicitud:
      properties:
        nombre:
          type: string
          maxLength: 200
          minLength: 1
          title: Nombre
      type: object
      required:
      - nombre
      title: ListaProductoSolicitud
    ListaRespuesta:
      properties:
        lista:
          items:
            type: string
          type: array
          title: Lista
      type: object
      required:
      - lista
      title: ListaRespuesta
    OkRespuesta:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
      type: object
      title: OkRespuesta
    PermisoRespuesta:
      properties:
        codigo:
          type: string
          title: Codigo
        descripcion:
          type: string
          title: Descripcion
      type: object
      required:
      - codigo
      - descripcion
      title: PermisoRespuesta
    PrecioSolicitud:
      properties:
        producto_id:
          type: string
          minLength: 1
          title: Producto Id
        precio:
          type: number
          minimum: 0.0
          title: Precio
      type: object
      required:
      - producto_id
      - precio
      title: PrecioSolicitud
    ProductoRespuesta:
      properties:
        producto_id:
          type: string
          title: Producto Id
        nombre:
          type: string
          title: Nombre
        marca:
          type: string
          title: Marca
        categoria:
          type: string
          title: Categoria
        tipo:
          type: string
          title: Tipo
        precio:
          type: number
          title: Precio
        precio_final:
          type: number
          title: Precio Final
        costo_envio:
          anyOf:
          - type: number
          - type: 'null'
          title: Costo Envio
        meses:
          anyOf:
          - type: integer
          - type: 'null'
          title: Meses
      type: object
      required:
      - producto_id
      - nombre
      - marca
      - categoria
      - tipo
      - precio
      - precio_final
      title: ProductoRespuesta
    ProductoSolicitud:
      properties:
        nombre:
          type: string
          maxLength: 200
          minLength: 1
          title: Nombre
        precio:
          type: number
          minimum: 0.0
          title: Precio
        marca:
          type: string
          maxLength: 120
          title: Marca
          default: Generica
        categoria:
          type: string
          maxLength: 120
          title: Categoria
          default: General
        tipo:
          type: string
          enum:
          - normal
          - fisico
          - digital
          - suscripcion
          title: Tipo
          default: normal
        costo_envio:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Costo Envio
        meses:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Meses
      type: object
      required:
      - nombre
      - precio
      title: ProductoSolicitud
    ProveedorSesion:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 1
          title: Nombre
      type: object
      required:
      - nombre
      title: ProveedorSesion
    ProveedorSolicitud:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 1
          title: Nombre
        almacen_id:
          type: integer
          minimum: 1.0
          title: Almacen Id
      type: object
      required:
      - nombre
      - almacen_id
      title: ProveedorSolicitud
    ResultadoBusquedaItem:
      properties:
        almacen_id:
          type: integer
          title: Almacen Id
        almacen:
          type: string
          title: Almacen
        producto:
          $ref: '#/components/schemas/ProductoRespuesta'
      type: object
      required:
      - almacen_id
      - almacen
      - producto
      title: ResultadoBusquedaItem
    ResumenCarrito:
      properties:
        productos:
          items:
            $ref: '#/components/schemas/ProductoRespuesta'
          type: array
          title: Productos
        subtotal:
          type: number
          title: Subtotal
        total:
          type: number
          title: Total
        descuento:
          type: string
          title: Descuento
      type: object
      required:
      - productos
      - subtotal
      - total
      - descuento
      title: ResumenCarrito
    RolRespuesta:
      properties:
        rol:
          type: string
          title: Rol
        descripcion:
          type: string
          title: Descripcion
        permisos:
          items:
            type: string
          type: array
          title: Permisos
        sistema:
          type: boolean
          title: Sistema
          default: true
      type: object
      required:
      - rol
      - descripcion
      - permisos
      title: RolRespuesta
    SesionCreada:
      properties:
        session_id:
          type: string
          title: Session Id
        usuario:
          type: string
          title: Usuario
        rol:
          type: string
          title: Rol
        permisos:
          items:
            type: string
          type: array
          title: Permisos
        almacen_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Almacen Id
        usuario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Usuario Id
      type: object
      required:
      - session_id
      - usuario
      - rol
      title: SesionCreada
    UsuarioActualizacion:
      properties:
        rol:
          anyOf:
          - type: string
            enum:
            - INVITADO
            - CLIENTE
            - PROVEEDOR
            - ADMIN
          - type: 'null'
          title: Rol
        almacen_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Almacen Id
        activo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Activo
      type: object
      title: UsuarioActualizacion
      description: 'PATCH parcial: solo se aplican los campos enviados.'
    UsuarioRespuesta:
      properties:
        usuario_id:
          type: string
          title: Usuario Id
        nombre:
          type: string
          title: Nombre
        rol:
          type: string
          title: Rol
        almacen_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Almacen Id
        activo:
          type: boolean
          title: Activo
        creado_en:
          anyOf:
          - type: string
          - type: 'null'
          title: Creado En
      type: object
      required:
      - usuario_id
      - nombre
      - rol
      - activo
      title: UsuarioRespuesta
    UsuarioSesion:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 1
          title: Nombre
      type: object
      required:
      - nombre
      title: UsuarioSesion
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: Salud
  description: Disponibilidad de la API y MongoDB.
- name: Almacenes
  description: Almacenes e inventarios.
- name: Seguridad
  description: Roles, permisos y usuarios.
- name: Sesiones
  description: Sesiones de cliente, proveedor y administrador.
- name: Lista de compras
  description: Lista personal del cliente.
- name: Búsqueda
  description: Comparación entre almacenes.
- name: Carrito
  description: Carrito y descuentos.
- name: Administración
  description: Alta, precios y CSV.
- name: Exportación
  description: Descarga de listas y carrito en CSV.
