openapi: 3.1.0
info:
  title: Asistente de Compras API
  description: API REST MVC del asistente de compras multi-almacén. Cada almacén usa
    una base MongoDB independiente y la base ``comparador`` integra los productos
    mediante Change Streams.
  version: 3.1.0
servers:
- url: http://localhost:8000
  description: Servidor local
paths:
  /api/v1/health:
    get:
      tags:
      - Salud
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRespuesta'
  /api/v1/health/live:
    get:
      tags:
      - Salud
      summary: Health Live
      operationId: health_live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRespuesta'
  /api/v1/health/ready:
    get:
      tags:
      - Salud
      summary: Health Ready
      operationId: health_ready_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRespuesta'
  /api/v1/warehouses:
    get:
      tags:
      - Almacenes
      summary: Listar Almacenes
      operationId: listar_almacenes_api_v1_warehouses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AlmacenRespuesta'
                type: array
                title: Response Listar Almacenes Api V1 Warehouses Get
  /api/v1/warehouses/{almacen_id}/products:
    get:
      tags:
      - Almacenes
      summary: Listar Productos
      operationId: listar_productos_api_v1_warehouses__almacen_id__products_get
      parameters:
      - name: almacen_id
        in: path
        required: true
        schema:
          type: integer
          title: Almacen Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Máximo de productos a devolver
          default: 100
          title: Limit
        description: Máximo de productos a devolver
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Productos a omitir
          default: 0
          title: Offset
        description: Productos a omitir
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoRespuesta'
                title: Response Listar Productos Api V1 Warehouses  Almacen Id  Products
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/roles:
    get:
      tags:
      - Seguridad
      summary: Listar Roles
      description: 'Catálogo público: qué puede hacer cada rol y qué significa cada
        permiso.'
