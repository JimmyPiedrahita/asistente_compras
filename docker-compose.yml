services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_local
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ping: 1}).ok\" localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo_data: