services:
  mongodb:
    image: mongo:7.0
    container_name: asistente_compras_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    container_name: asistente_compras_app
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}@mongodb:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-asistente_compras}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador de la aplicación}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      MAX_SESSIONS: ${MAX_SESSIONS:-1000}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
