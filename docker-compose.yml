services:
  mongodb:
    image: mongo:7.0
    container_name: asistente_compras_mongodb
    ports:
      - "27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand({ping: 1}).ok\" localhost:27017/test | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    container_name: asistente_compras_api
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Define ADMIN_CLAVE en .env o en el entorno}
      MONGODB_DB_PREFIX: ${MONGODB_DB_PREFIX:-warehouse}
      WAREHOUSES: ${WAREHOUSES:-}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      MAX_SESSIONS: ${MAX_SESSIONS:-1000}
      MAX_CSV_BYTES: ${MAX_CSV_BYTES:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
    profiles: ["tools"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Define ADMIN_CLAVE en .env o en el entorno}
      MONGODB_DB_PREFIX: ${MONGODB_DB_PREFIX:-warehouse}
      WAREHOUSES: ${WAREHOUSES:-}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-5000}
    command: ["python", "scripts/seed_mongodb.py", "--archivo", "productos_ejemplo.csv"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  mongo_data:
