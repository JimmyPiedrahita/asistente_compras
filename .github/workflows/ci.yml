name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Iniciar MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0
          for _ in $(seq 1 60); do
            if docker exec mongodb mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB no respondió" >&2
          docker logs mongodb
          exit 1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Pruebas
        run: python -m pytest tests -q

      - name: Compilar interfaz
        run: |
          cd frontend
          npm ci
          npm run build

      - name: OpenAPI actualizado
        run: |
          python scripts/exportar_openapi.py
          git diff --exit-code openapi.yaml
